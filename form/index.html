<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <form action="#" class="form">
        <h1 class="title">Creat Account</h1>
        <div class="row">
            <div class="label">Name</div>
            <input type="text" name="name" class="name" placeholder="Enter Name">
            <div class="small">Error message goes here</div>
        </div>
        <div class="row">
            <div class="label">Email</div>
            <input type="text" name="email" class="email" placeholder="E-mail">
            <div class="small">Error message goes here</div>
        </div>
        <div class="row">
            <div class="label">Password</div>
            <input type="password" name="password" class="password" placeholder="Enter Password">
            <div class="small">Error message goes here</div>
        </div>
        <div class="row">
            <div class="label">Confirm Psaaword</div>
            <input type="password" name="confirm" class="confirm" placeholder="Enter Password Again">
            <div class="small">Error message goes here</div>
        </div>
        <button>Sign up</button>
        <div class="agree">
            <input type="checkbox">
            <div>I have read and agree to the Terms of Service</div>
        </div>
        </div>
    </form>
    <script>
        //获取元素
        const nameEle = document.querySelector('.name')
        const emailEle = document.querySelector('.email')
        const passwordEle = document.querySelector('.password')
        const confirmEle = document.querySelector('.confirm')
        const form = document.querySelector('.form')
        const agree = document.querySelector('.agree input')

        //表单提交事件
        form.addEventListener('submit', e => {
            //阻止
            e.preventDefault()
            verify()
        })
        function verify() {
            // console.log(1)
            //姓名
            const name = nameEle.value.trim()
            if (name === '') {
                Error(nameEle, 'Name cannot be Empty')
            } else {
                Success(nameEle)
            }

            //邮箱
            const email = emailEle.value.trim()
            //判断邮箱格式
            if (!test(email)) {
                Error(emailEle, 'Email is not valid')
            }
            else if (email === '') {
                Error(emailEle, 'Email cannot be Empty')
            }
            else {
                Success(emailEle)
            }

            //密码
            const psd = passwordEle.value.trim()
            if (psd === '') {
                Error(passwordEle, 'Password cannot be Empty')
            } else {
                Success(passwordEle)
            }

            //确认密码
            const confirm = confirmEle.value.trim()
            if (confirm === '') {
                Error(confirmEle, 'Confirm Password is required')
            } else if (confirm !== psd) {
                Error(confirmEle, `Password didn't match`)
            } else {
                Success(confirmEle)
            }

            //同意模块
            if(!agree.checked){
                alert('请勾选！')
                agree.nextElementSibling.style.color='red'
            }else{
                agree.nextElementSibling.style.color='black'
            }
        }


        //失败
        function Error(ele, message) {
            // console.log(1)
            const row = ele.parentElement
            const small = row.querySelector('.small')
            row.className = 'row error'
            small.innerText = message
        }
        //成功
        function Success(ele) {
            // console.log(1)
            ele.parentElement.className = 'row success'
        }

        //判断邮箱
        function test(email) {
            const reg = /^(([^<>()\[\]\\.,;:\s@"]+(\.[^<>()\[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
            return reg.test(email)
        }
    </script>
</body>

</html>
